<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faculty Room Allocation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F8FA; --navy:#162E4D; --navy-soft:#24456F; --gold:#B08D3E;
    --gold-soft:#E4D6AE; --slate:#5A6270; --hairline:#D8DDE5; --error:#A23B2E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 12% 8%, rgba(22,46,77,0.07), transparent 42%),
      radial-gradient(circle at 92% 90%, rgba(176,141,62,0.10), transparent 45%),
      var(--paper);
    font-family:'Inter', sans-serif; color:var(--navy);
    display:flex; align-items:center; justify-content:center; padding:26px 16px;
  }
  .wrap{ width:100%; max-width:460px; }
  .masthead{ text-align:center; margin-bottom:20px; }
  .masthead img.logo{ width:150px; height:auto; display:block; margin:0 auto 14px; }
  .masthead h1{ font-family:'Source Serif 4', serif; font-weight:600; font-size:25px; line-height:1.25; margin:0 0 6px; }
  .masthead p{ margin:0; font-size:14px; color:var(--slate); }

  .ticket{ background:#fff; border:1px solid var(--hairline); border-radius:14px;
    box-shadow:0 18px 40px -22px rgba(22,46,77,0.38); overflow:hidden; }
  .panel{ padding:26px 26px 24px; }
  .panel.hidden-after{ display:none; }

  label{ display:block; font-size:12.5px; font-weight:600; color:var(--slate); margin-bottom:8px; }
  input[type="text"]{
    width:100%; padding:13px 14px; font-size:15.5px; font-family:'Inter', sans-serif;
    border:1.5px solid var(--hairline); border-radius:9px; background:var(--paper);
    color:var(--navy); outline:none; transition:border-color .15s ease;
  }
  input[type="text"]:focus{ border-color:var(--navy); }
  input[type="text"]::placeholder{ color:#A3AAB5; }
  button{
    display:flex; align-items:center; justify-content:center; margin-top:14px; width:100%;
    padding:13px 14px; font-size:15px; font-weight:600; font-family:'Inter', sans-serif;
    letter-spacing:0.2px; color:#fff; background:var(--navy); border:none; border-radius:9px;
    cursor:pointer; transition:background .15s ease, transform .05s ease;
  }
  button:hover{ background:var(--navy-soft); }
  button:active{ transform:translateY(1px); }
  .hint{ margin:10px 0 0; font-size:12.5px; color:var(--slate); }
  .error-msg{ display:none; margin-top:14px; padding:11px 13px; background:#F7EDEA;
    border:1px solid #E3C6BE; color:var(--error); font-size:13.5px; border-radius:8px; }

  .tear{ position:relative; height:0; border-top:1.5px dashed var(--hairline); display:none; }
  .tear::before, .tear::after{ content:""; position:absolute; top:-11px; width:22px; height:22px;
    background:var(--paper); border-radius:50%; }
  .tear::before{ left:-11px; } .tear::after{ right:-11px; }

  .result{ display:none; padding:24px 26px 26px; }
  .result.visible{ display:block; }
  .result-name{ font-family:'Source Serif 4', serif; font-weight:600; font-size:22px; margin:0 0 8px; }
  .badge{ display:inline-block; font-size:11px; font-weight:700; letter-spacing:0.5px;
    text-transform:uppercase; padding:4px 10px; border-radius:20px; margin:0 0 18px; }
  .badge.head{ background:var(--gold); color:#fff; }
  .badge.member{ background:var(--paper); color:var(--slate); border:1px solid var(--hairline); }

  .room-highlight{ display:flex; gap:12px; margin-bottom:6px; }
  .room-box{ flex:1; background:var(--navy); color:#fff; border-radius:10px; padding:14px 16px; text-align:center; }
  .room-box .label{ font-size:11px; letter-spacing:0.4px; color:var(--gold-soft); font-weight:600; margin-bottom:5px; }
  .room-box .value{ font-family:'Source Serif 4', serif; font-size:22px; font-weight:600; }

  .field-row{ display:flex; justify-content:space-between; gap:16px; padding:11px 0; border-bottom:1px solid var(--hairline); }
  .field-row:last-of-type{ border-bottom:none; }
  .field-label{ font-size:12.5px; color:var(--slate); font-weight:600; flex:0 0 36%; padding-top:1px; }
  .field-value{ font-size:14.5px; text-align:right; flex:1; word-break:break-word; }
  .field-value div + div{ margin-top:3px; }

  .note{ margin:12px 0 0; padding:10px 12px; background:#FBF6E8; border:1px solid var(--gold-soft);
    border-radius:8px; font-size:13px; color:#6B5520; font-weight:500; }

  .section-heading{ font-size:11px; letter-spacing:0.5px; font-weight:700; color:var(--gold);
    text-transform:uppercase; margin:22px 0 8px; }
  .team{ list-style:none; margin:0; padding:0; border:1px solid var(--hairline); border-radius:10px; overflow:hidden; }
  .team li{ display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 12px; font-size:13.5px; border-bottom:1px solid var(--hairline); }
  .team li:last-child{ border-bottom:none; }
  .team li.me{ background:#EEF2F8; font-weight:600; }
  .team .code{ display:block; font-size:11.5px; color:var(--slate); font-weight:400; margin-top:1px; }
  .team .tag{ flex-shrink:0; font-size:10px; font-weight:700; letter-spacing:0.4px; text-transform:uppercase;
    padding:3px 8px; border-radius:20px; }
  .team .tag.head{ background:var(--gold); color:#fff; }
  .team .tag.you{ background:var(--navy); color:#fff; }

  .new-search{ background:transparent; color:var(--navy); border:1.5px solid var(--hairline); margin-top:20px; }
  .new-search:hover{ background:var(--paper); }
</style>
</head>

  const $ = (id) => document.getElementById(id);
  const codeInput = $('codeInput'), errorMsg = $('errorMsg');
  const normalize = (s) => (s || '').replace(/\s+/g, '').toUpperCase();

  const INDEX = {};
  Object.keys(FACULTY).forEach(k => { INDEX[normalize(k)] = k; });
  // convenience: allow digits only (e.g. 02032) when it maps to exactly one PUNIV code
  const DIGITS = {}, DUP = {};
  Object.keys(FACULTY).forEach(k => {
    const m = k.match(/^PUNIV(\d+)$/i);
    if(m){ if(DIGITS[m[1]]) DUP[m[1]] = true; DIGITS[m[1]] = k; }
  });

  function lookup(raw){
    const n = normalize(raw);
    if(!n) return null;
    if(INDEX[n]) return INDEX[n];
    if(/^\d+$/.test(n) && DIGITS[n] && !DUP[n]) return DIGITS[n];
    return null;
  }

  function showResult(id){
    const f = FACULTY[id], r = ROOMS[f.room];
    $('rName').textContent = f.name;
    const b = $('rBadge');
    b.textContent = f.head ? 'Class Head' : 'Faculty';
    b.className = 'badge ' + (f.head ? 'head' : 'member');
    $('rRoom').textContent = f.room;
    $('rCount').textContent = (r.count === null || r.count === undefined) ? '—' : r.count;
    $('rCode').textContent = (id === f.name) ? 'Not listed' : id;
    $('rFacSchool').textContent = f.school || '—';
    const ss = $('rStuSchool'); ss.textContent = '';
    (r.students || []).forEach(s => { const d = document.createElement('div'); d.textContent = s; ss.appendChild(d); });
    if(!ss.firstChild) ss.textContent = '—';
    const note = $('rNote');
    if(r.note){ note.textContent = r.note; note.style.display = 'block'; } else { note.style.display = 'none'; }

    const ul = $('rTeam'); ul.textContent = '';
    r.faculty.forEach(m => {
      const li = document.createElement('li');
      if(m.id === id) li.className = 'me';
      const left = document.createElement('div');
      left.textContent = m.name;
      if(m.id !== m.name){ const code = document.createElement('span'); code.className = 'code'; code.textContent = m.id; left.appendChild(code); }
      li.appendChild(left);
      const tags = document.createElement('div');
      if(m.head){ const t = document.createElement('span'); t.className = 'tag head'; t.textContent = 'Head'; tags.appendChild(t); }
      if(m.id === id){ const t = document.createElement('span'); t.className = 'tag you'; t.textContent = 'You'; t.style.marginLeft = '6px'; tags.appendChild(t); }
      li.appendChild(tags);
      ul.appendChild(li);
    });

    $('formPanel').classList.add('hidden-after');
    $('tearDivider').style.display = 'block';
    $('resultPanel').classList.add('visible');
    errorMsg.style.display = 'none';
    window.scrollTo(0, 0);
  }

  function showError(msg){ errorMsg.textContent = msg; errorMsg.style.display = 'block'; }

  function handleSubmit(){
    if(!normalize(codeInput.value)){ showError('Please enter your employee code.'); return; }
    const id = lookup(codeInput.value);
    if(id){ showResult(id); }
    else { showError("We couldn't find that code. Double-check it and try again."); }
  }

  $('submitBtn').addEventListener('click', handleSubmit);
  codeInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') handleSubmit(); });
  $('newSearchBtn').addEventListener('click', () => {
    $('formPanel').classList.remove('hidden-after');
    $('tearDivider').style.display = 'none';
    $('resultPanel').classList.remove('visible');
    codeInput.value = ''; codeInput.focus(); errorMsg.style.display = 'none';
  });
